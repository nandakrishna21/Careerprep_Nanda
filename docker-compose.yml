services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerprep
      POSTGRES_PASSWORD: careerprep
      POSTGRES_DB: careerprep
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerprep -d careerprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://careerprep:careerprep@db:5432/careerprep
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@careerprep.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
