# Render blueprint — CareerPrep Hub API (free-tier web service).
# Docs: https://render.com/docs/blueprint-spec
#
# Steps:
#   1. Create a free Neon project (https://neon.tech) and copy the pooled
#      connection string (it already contains the password).
#   2. Push this repo to GitHub and create a new Blueprint on Render from it.
#   3. Set the `sync: false` values below from the Render dashboard:
#        DATABASE_URL  = Neon connection string
#        GEMINI_API_KEY = Google AI Studio key
#        APIFY_TOKEN   = Apify API token (optional; enables job sync)
#        ADMIN_EMAIL / ADMIN_PASSWORD = the bootstrap admin login
#   4. Point CORS_ORIGINS at your Vercel frontend URL.
services:
  - type: web
    name: careerprep-api
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Shared secret for the daily 11 AM IST auto-sync. After deploy, copy its
      # value from the Render dashboard into cron-job.org:
      #   POST https://careerprep-api.onrender.com/api/jobs/sync/scheduled?token=<value>
      #   schedule: daily 11:00, timezone Asia/Kolkata.
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://careerprep-nanda.vercel.app,http://localhost:5173,http://localhost:3000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_MAX_ITEMS
        value: 25
      - key: ADMIN_EMAIL
        value: admin@careerprep.com
      - key: ADMIN_PASSWORD
        sync: false
      # Signup now sends an OTP email: production REQUIRES working SMTP or
      # registration fails. Free options: Gmail app password
      # (smtp.gmail.com:587) or Brevo free tier (smtp-relay.brevo.com:587).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false